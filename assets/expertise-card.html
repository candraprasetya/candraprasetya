<html lang="en">

<meta charset="utf-8">

<title>Expertise card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --card: #ffffff;
    --border: #e2e8f0;
    --title: #0f172a;
    --label: #0f172a;
    --chip: #f1f5f9;
    --icon: #0f766e;
    --chip-primary: #0f766e;
    --icon-primary: #ffffff;
    --page: #f8fafc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card: #0f172a;
      --border: #1e293b;
      --title: #f1f5f9;
      --label: #e2e8f0;
      --chip: #1e293b;
      --icon: #2dd4bf;
      --chip-primary: #2dd4bf;
      --icon-primary: #0f172a;
      --page: #020617;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
    background: var(--page);
    font-family: 'Google Sans', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: min(360px, 100%);
    padding: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    margin: 0;
  }
  .card__title {
    /* 41px puts the first row at y=88, the same grid start expertise-*.svg uses */
    margin: 0 0 41px;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--title);
  }
  .card__list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 16px;
  }
  .card__list li {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .chip {
    flex: 0 0 36px;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--chip);
    color: var(--icon);
  }
  .chip--primary {
    background: var(--chip-primary);
    color: var(--icon-primary);
  }
  .chip svg { width: 20px; height: 20px; display: block; }
  .label { font-size: 15px; font-weight: 600; color: var(--label); }
</style>
</head>
